</div>
<script>
   function openNav() {
  const menu = document.getElementById("i_container");
  const blur = document.getElementById("blurOverlay");
  menu.style.width = "56vw";
  menu.style.borderLeft = "solid rgba(255,255,255,0.2) 0.5vw";
  document.getElementById("open").style.opacity = "0";
  document.getElementById("close").style.opacity = "1";
  blur.style.opacity = "1";
  blur.style.pointerEvents = "auto";
  document.body.classList.add("noscroll");
}

function closeNav() {
  const menu = document.getElementById("i_container");
  const blur = document.getElementById("blurOverlay");
  menu.style.width = "0vw";
  menu.style.borderLeft = "none";
  document.getElementById("open").style.opacity = "1";
  document.getElementById("close").style.opacity = "0";
  blur.style.opacity = "0";
  blur.style.pointerEvents = "none";
  document.body.classList.remove("noscroll");
}
document.addEventListener("click", function (event) {
  const menu = document.getElementById("i_container");
  const openBtn = document.getElementById("open");
  
const blur = document.getElementById("blurOverlay");
 const closeBtn = document.getElementById("close");
  const isClickInside = menu.contains(event.target) || openBtn.contains(event.target);

  if (!isClickInside) {
    menu.style.width = "0";
    openBtn.style.opacity = "1";
    closeBtn.style.opacity = "0";
    blur.style.opacity = "0";
    blur.style.pointerEvents = "none";
  }
});
  </script>
